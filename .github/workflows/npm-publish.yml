name: Node.js CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm ci
      - run: npm test
      - name: Publish npm package
        uses: npm-publish/npm-publish@latest
        with:
          token: ${{ secrets.NPM_TOKEN }}
